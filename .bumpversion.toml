[tool.bumpversion]
current_version = "0.3.1"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = true
tag = true
tag_name = "v{new_version}"
message = "Release v{new_version}"
tag_message = "re-frame.vertica v{new_version}"

[[tool.bumpversion.files]]
filename = "package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "package-lock.json"
search = '''  "name": "re-frame.vertica",
  "version": "{current_version}",'''
replace = '''  "name": "re-frame.vertica",
  "version": "{new_version}",'''

[[tool.bumpversion.files]]
filename = "package-lock.json"
search = '''      "name": "re-frame.vertica",
      "version": "{current_version}",'''
replace = '''      "name": "re-frame.vertica",
      "version": "{new_version}",'''

[[tool.bumpversion.files]]
filename = "project.clj"
search = '(defproject net.clojars.frknzd/re-frame.vertica "{current_version}"'
replace = '(defproject net.clojars.frknzd/re-frame.vertica "{new_version}"'

[[tool.bumpversion.files]]
filename = "README.md"
search = 'net.clojars.frknzd/re-frame.vertica {{:mvn/version "{current_version}"}}'
replace = 'net.clojars.frknzd/re-frame.vertica {{:mvn/version "{new_version}"}}'

[[tool.bumpversion.files]]
filename = "README.md"
search = '[net.clojars.frknzd/re-frame.vertica "{current_version}"]'
replace = '[net.clojars.frknzd/re-frame.vertica "{new_version}"]'
