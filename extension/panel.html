<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="panel.css">
    <title>re-frame Inspector</title>
  </head>
  <body>
    <header>
      <strong>re-frame Inspector</strong>
      <span id="status">Connecting…</span>
      <button id="pick" title="Pick an element in the page">⌖ Pick</button>
      <button id="fit" title="Fit graph to view">Fit</button>
    </header>
    <main>
      <section id="canvas-wrap">
        <svg id="graph" role="img" aria-label="re-frame provenance graph">
          <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#536174"></path></marker></defs>
          <g id="viewport"><g id="edges"></g><g id="nodes"></g></g>
        </svg>
        <div id="empty">Select an element in Elements or use Pick.</div>
      </section>
      <aside id="details" hidden></aside>
    </main>
    <script src="panel.js"></script>
  </body>
</html>
